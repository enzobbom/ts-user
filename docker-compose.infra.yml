name: ts-user

services:
  postgres:
    image: postgres:14-alpine
    networks:
      - ts-user
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${TS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TS_POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  ts-user:
    driver: bridge