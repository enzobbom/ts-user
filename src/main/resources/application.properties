spring.application.name=ts-user
spring.application.description = Task Scheduler - User module

server.forward-headers-strategy = framework

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

ts.jwt.secret=${TS_JWT_SECRET:local-dev-jwt-secret-must-be-longer-than-32-chars}
ts.jwt.expiration=${TS_JWT_EXPIRATION:86400000}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${TS_SHOW_SQL:true}

spring.datasource.url=jdbc:postgresql://${TS_POSTGRES_HOST:localhost}:${TS_POSTGRES_PORT:5432}/${TS_POSTGRES_DB:ts_user}
spring.datasource.username=${TS_POSTGRES_USER:dev_user}
spring.datasource.password=${TS_POSTGRES_PASSWORD:devpass}

viacep.url=https://viacep.com.br
